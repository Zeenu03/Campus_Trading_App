<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Campus Trading</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body { background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%); min-height: 100vh; display: flex; align-items: center; }
    .login-card { border: none; border-radius: 1rem; box-shadow: 0 1rem 3rem rgba(0,0,0,.175); }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="text-center text-white mb-4">
          <i class="bi bi-shop display-4"></i>
          <h2 class="fw-bold mt-2">Campus Trading</h2>
          <p class="opacity-75">IITGN Marketplace</p>
        </div>
        <div class="card login-card">
          <div class="card-body p-4">
            <h5 class="card-title fw-bold mb-4">Sign In</h5>
            {% if error %}
            <div class="alert alert-danger py-2"><i class="bi bi-exclamation-circle me-2"></i>{{ error }}</div>
            {% endif %}
            <form method="POST" action="{{ url_for('views.login_page') }}">
              <div class="mb-3">
                <label class="form-label fw-medium">Username or Email</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input type="text" name="user" class="form-control" placeholder="Enter username or email" required autofocus>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label fw-medium">Password</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
              </div>
              <button type="submit" class="btn btn-primary w-100 py-2 fw-medium mt-2">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
              </button>
              <p class="text-center mt-3 mb-0">
                <small class="text-muted">
                  Having trouble? <a href="/setup-passwords" class="text-muted">Reset passwords</a>
                </small>
              </p>
            </form>
          </div>
        </div>
        <p class="text-center text-white-50 mt-3 small">CS432 Databases · Team 8 · IITGN 2026</p>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

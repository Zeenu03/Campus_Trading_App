{% extends 'base.html' %}
{% block title %}{% if edit_mode %}Edit Listing{% else %}Create Listing{% endif %}{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-lg-7">
    <h3 class="fw-bold mb-4">
      <i class="bi bi-{% if edit_mode %}pencil{% else %}plus-circle{% endif %} me-2 text-primary"></i>
      {% if edit_mode %}Edit Listing{% else %}Create New Listing{% endif %}
    </h3>

    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">

        <form method="POST">

          <div class="mb-3">
            <label class="form-label fw-medium">Title <span class="text-danger">*</span></label>
            <input type="text" name="title" class="form-control"
                   value="{{ listing.title if listing else '' }}"
                   placeholder="e.g. Calculus textbook – Stewart 8th ed" required>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-medium">Asking Price (₹) <span class="text-danger">*</span></label>
              <input type="number" name="asking_price" class="form-control"
                     value="{{ listing.asking_price if listing else '' }}"
                     min="0" step="0.01" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-medium">Category <span class="text-danger">*</span></label>
              <select name="category_id" class="form-select" required>
                <option value="">Select category…</option>
                {% for cat in categories %}
                  <option value="{{ cat.CategoryID }}"
                    {% if listing and listing.category_id == cat.CategoryID %}selected{% endif %}>
                    {{ cat.CategoryName }}
                  </option>
                  {% for sub in cat.subcategories %}
                    <option value="{{ sub.CategoryID }}"
                      {% if listing and listing.category_id == sub.CategoryID %}selected{% endif %}>
                      &nbsp;&nbsp;{{ sub.CategoryName }}
                    </option>
                  {% endfor %}
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-medium">Condition</label>
              <select name="condition" class="form-select">
                <option value="">Select condition</option>
                {% for c in ['New','Like New','Good','Fair','Poor'] %}
                <option {% if listing and listing.condition == c %}selected{% endif %}>{{ c }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-medium">Course Code</label>
              <input type="text" name="course_code" class="form-control"
                     value="{{ listing.course_code if listing else '' }}"
                     placeholder="e.g. MA101">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-medium">Description</label>
            <textarea name="description" class="form-control" rows="3"
                      placeholder="Describe the item…">{{ listing.description if listing else '' }}</textarea>
          </div>

          <div class="mb-3">
            <label class="form-label fw-medium">Preferred Meeting Location</label>
            <input type="text" name="meeting_location" class="form-control"
                   value="{{ listing.meeting_location if listing else '' }}"
                   placeholder="e.g. Library ground floor">
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="is_negotiable" id="is_negotiable"
                  {% if not listing or listing.is_negotiable %}checked{% endif %}>
                <label class="form-check-label" for="is_negotiable">Price is negotiable</label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="is_donation" id="is_donation"
                  {% if listing and listing.is_donation %}checked{% endif %}>
                <label class="form-check-label" for="is_donation">This is a donation (free)</label>
              </div>
            </div>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-grow-1">
              <i class="bi bi-check-lg me-2"></i>
              {% if edit_mode %}Save Changes{% else %}Post Listing{% endif %}
            </button>
            <a href="{{ url_for('views.listings_page') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
